server {
    # default_server because the www block below also listens on 80, and the
    # healthcheck (Host: 127.0.0.1) has to land here, not on the redirect.
    listen 80 default_server;
    # The nginx image's entrypoint (10-listen-on-ipv6-by-default.sh) normally adds
    # this, but it bails when default.conf differs from the packaged one, which
    # ours does. Without it `localhost` (which resolves to ::1 first) is refused,
    # and container healthchecks fail even though the site is up.
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # llms.txt is UTF-8, and text/plain without a charset gets guessed at.
    charset utf-8;

    # gzip the text assets; the images are already compressed.
    gzip on;
    gzip_types text/plain text/css text/markdown application/javascript image/svg+xml;
    gzip_min_length 512;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprint-free assets, so keep the cache short enough to notice edits.
    location ~* \.(css|js|png|jpg|webp|svg|webmanifest)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}

# www.meerpic.com, if Coolify routes it here too: one canonical address, so
# links and search results do not split between the two.
server {
    listen 80;
    listen [::]:80;
    server_name www.meerpic.com;
    return 301 https://meerpic.com$request_uri;
}
